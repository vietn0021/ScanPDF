name: scanpdf
description: Quét, chỉnh sửa và chia sẻ tài liệu PDF trên Android.
publish_to: none
version: 1.0.1+2
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.2
  image_picker: ^1.2.0
  image: 4.5.4
  path_provider: ^2.1.5
  pdf: 3.11.3
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  http_parser: ^4.1.2
  crypto: ^3.0.7
  uuid: ^4.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/stitch/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/roboto-black.ttf
          weight: 900
